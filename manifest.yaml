version: 0.4.0
rules:
  core:
    adventurers_manual: rules/core/adventurers_manual.md
    custodians_almanac: rules/core/custodians_almanac.md
  quickstart: rules/quickstart.md
skins:
  clanfire:
    name: Clanfire
    file: skins/clanfire.md
    pressure_track: Shadow
    pressure_scope: party
    pressure_steps:
    - step: 2
      kind: custodian
      label: 'Strange tracks: minor Disadvantage and resource drain selected by the Custodian'
    - step: 4
      kind: luck_cost
      label: Rites cost an extra Instinct bead
      contexts:
      - rite
      amount: 1
    resources:
      totem_mark:
        name: Totem Mark
        kind: uses
        scope: character
        limit: 1
        reset: session
      beast_bond:
        name: Beast Bond
        kind: pool
        scope: character
        initial: 0
        max: 3
    _gen:
      primary: MGT
      min_steps: 2
      max_steps: 4
    attributes:
      MGT: Might
      FLT: Fleetness
      CUN: Cunning
      SPR: Spirit
      INS: Instinct
    luck_key: INS
    luck_name: Instinct
  iron_and_ruin:
    name: Iron & Ruin
    file: skins/iron_and_ruin.md
    pressure_track: Doom
    pressure_scope: party
    pressure_steps:
    - step: 2
      kind: custodian
      label: 'Blood sigils: minor Disadvantage selected by the Custodian'
    - step: 3
      kind: luck_cost
      label: Rituals cost an extra Fortune token
      contexts:
      - ritual
      amount: 1
    resources:
      heroic_act:
        name: Heroic Act
        kind: uses
        scope: character
        limit: 1
        reset: session
    _gen:
